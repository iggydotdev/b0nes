name: Publish to NPM

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: inputs.tag != '' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import {releasePlan} from "./.github/scripts/release-plan.mjs"; const p=JSON.parse(fs.readFileSync("package.json")); releasePlan(p,JSON.parse(fs.readFileSync("package-lock.json")),null,"release"); if(process.env.RELEASE_TAG !== `v${p.version}`) throw Error("Release tag does not match package version");'
      - run: npm ci
      - run: npm test
      - name: Publish unless this version is already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node .github/scripts/publish.mjs
